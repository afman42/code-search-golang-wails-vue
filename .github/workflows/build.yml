name: Build & Test

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      # Frontend toolchain, lint, and E2E are OS-independent; running them on
      # all three OSes would triple CI minutes for identical results. Only the
      # Go test step is matrixed.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Linux Dependencies
        run: |
          sudo apt update
          sudo apt install -y libgtk-3-dev libwebkit2gtk-4.1-dev libwebkit2gtk-4.1-0 build-essential curl file git

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-browsers-

      - name: Install Playwright Chromium + Chrome
        run: npx playwright install --with-deps chromium chrome
        working-directory: frontend

      - name: Build Frontend Dist
        run: npm run build
        working-directory: frontend


      - name: Go Format Check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      # Tool versions are pinned. Unpinned `@latest` made builds
      # non-reproducible: a new upstream release could fail CI with no repo
      # change, and two runs of the same commit could disagree.
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      # Runs on ALL THREE OSes — this is the step the matrix exists for.
      # -race: TestLRUPatternCacheConcurrency and TestSymbolIndexCacheConcurrent
      # exist to catch data races and never ran under the detector. -race
      # requires -covermode=atomic and is several times slower, hence 600s.
      - name: Go Tests
        shell: bash
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out -timeout 600s ./...

      - name: Go Coverage Gate
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          echo "Total Go coverage: $total"
          pct=${total%\%}
          awk -v pct="$pct" 'BEGIN { if (pct + 0 < 80) { printf "FAIL: Go coverage %s%% is below the repo-rule target of 80%%\n", pct; exit 1 } }'

      - name: Upload Go Coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out

      - name: Frontend Unit Tests
        run: npm test
        working-directory: frontend

      - name: Frontend E2E Tests (Playwright)
        run: npm run test:e2e
        working-directory: frontend

      - name: Verify TypeScript Compilation
        run: npx vue-tsc --noEmit
        working-directory: frontend

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      # Pinned for the same reason as the test job's tools: `@latest` made
      # builds non-reproducible.
      - name: Install Obfuscated Garble
        run: go install mvdan.cc/garble@v0.14.2

      - name: Install Linux Dependencies
        run: |
          sudo apt update
          sudo apt install -y libgtk-3-dev upx-ucl
          sudo apt install -y libwebkit2gtk-4.1-dev libwebkit2gtk-4.1-0 build-essential curl file git
          # Cross-compilation tools for Windows: mingw gcc for CGO + strip
          sudo apt install -y gcc-mingw-w64-x86-64

      - name: Install Wails CLI
        # Version tracks github.com/wailsapp/wails/v2 in go.mod. A CLI newer
        # than the library is a real breakage source.
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: Build for Linux
        run: |
          go mod tidy
          # Optimize build: use -trimpath -buildmode=pie for smaller binaries
          wails build -platform linux --tags webkit2_41 -obfuscated -trimpath -ldflags "-s -w -buildmode=pie" -o code-search-golang-linux
          # Strip any remaining metadata that Go's -s -w might miss
          strip -s ./build/bin/code-search-golang-linux
          # Compress with maximum UPX settings
          upx --best --lzma ./build/bin/code-search-golang-linux
        working-directory: .

      - name: Build for Windows
        run: |
          go mod tidy
          # Optimize build: use -trimpath for smaller binaries. -buildmode=pie
          # is ELF-only and is NOT supported when targeting PE/Windows, so it
          # is omitted here (it remains enabled on the Linux build above).
          wails build -platform windows -obfuscated -trimpath -ldflags "-s -w" -o code-search-golang-windows.exe
          # Strip PE binary using mingw-w64 cross-strip tool
          x86_64-w64-mingw32-strip -s ./build/bin/code-search-golang-windows.exe
          # Compress with maximum UPX settings
          upx --best --lzma ./build/bin/code-search-golang-windows.exe
        working-directory: .

      - name: Upload Artifacts (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: code-search-golang-linux
          path: ./build/bin/code-search-golang-linux

      - name: Upload Artifacts (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: code-search-golang-windows
          path: ./build/bin/code-search-golang-windows.exe
