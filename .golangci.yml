version: "2"

linters:
  # Enumerated explicitly so a golangci-lint upgrade cannot silently change the
  # effective set. The first five are v2's current defaults; bodyclose and
  # misspell are the only additions — both correctness/typo checks, no style
  # linters, since this codebase is written to a consistent hand style.
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - misspell
  settings:
    errcheck:
      # Deferred Close on read-only opens has no actionable error path.
      exclude-functions:
        - (*os.File).Close
    staticcheck:
      # Drop the QF* quickfix/style category; keep SA (correctness) + S/ST.
      checks:
        - all
        - -QF1003
  exclusions:
    rules:
      # Test helpers intentionally ignore setup errors; a failure surfaces as
      # the assertion failing, not as a swallowed bug.
      - path: _test\.go
        linters:
          - errcheck
